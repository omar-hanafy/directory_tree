name: directory_tree_bench_runner
description: >-
  Compiles every benchmark implementation to an AOT executable, runs the
  shape x size matrix, and writes RESULTS.md.
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  directory_tree_bench_harness:
    path: ../harness
  directory_tree_bench_workloads:
    path: ../workloads

dev_dependencies:
  lints: ^6.0.0
  test: ^1.28.0

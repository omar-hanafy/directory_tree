name: pub-dry-run

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  dry-run:
    name: pub-dry-run / dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      # What is published must resolve from pub.dev exactly as users resolve
      # it: no pubspec_overrides.yaml, and no path, git, or overridden
      # dependency in the root pubspec.yaml. The benchmark packages are not
      # published, so they are not checked.
      - name: Release checks
        run: dart run tool/check_repo.dart --release

      # Warnings are fatal here; never add --ignore-warnings.
      - name: Pub publish dry-run
        run: dart pub publish --dry-run

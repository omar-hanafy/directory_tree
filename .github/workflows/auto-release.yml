name: Auto release

on:
  push:
    branches: [main, dev]

permissions: {}

# No concurrency group: GitHub cancels a pending run when a newer one queues
# in the same group, and a cancelled run would leave its version bump
# untagged for good, because the next push sees no version change. Runs
# cannot race: each compares only its own push's before and after versions.

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh release create; the tag push uses TAG_PUSH_PAT.
    steps:
      # The tag must be pushed with a PAT: a tag pushed with GITHUB_TOKEN does
      # not start the tag-triggered publish workflow. The credential must
      # persist for the `git push` below, and this job uploads no artifacts.
      - name: Checkout # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.TAG_PUSH_PAT }}

      # Tag only when the version value changed, not on every pubspec edit
      # (a dependency-only change must not try to re-create a release).
      - name: Compare package versions
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          pubspec='pubspec.yaml'
          before="$BEFORE_SHA"

          if [[ "$before" =~ ^0+$ ]]; then
            echo 'Branch creation detected; no release tag will be created.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          new_version=$(awk '/^version:/ {print $2; exit}' "$pubspec" | tr -d "\"'")
          if [[ -z "$new_version" ]]; then
            echo "Unable to read version from $pubspec."
            exit 1
          fi

          if git cat-file -e "$before:$pubspec" 2>/dev/null; then
            old_version=$(git show "$before:$pubspec" | awk '/^version:/ {print $2; exit}' | tr -d "\"'")
          else
            old_version=''
          fi

          if [[ "$old_version" == "$new_version" ]]; then
            echo "Version remains $new_version; no release tag will be created."
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stable_pattern='^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$'
          prerelease_pattern='^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+(\+[0-9A-Za-z.-]+)?$'

          if [[ "${GITHUB_REF_NAME}" == 'main' && ! "$new_version" =~ $stable_pattern ]]; then
            echo "main requires a stable semantic version, got $new_version."
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" == 'dev' && ! "$new_version" =~ $prerelease_pattern ]]; then
            echo "dev requires a prerelease semantic version, got $new_version."
            exit 1
          fi

          {
            echo 'changed=true'
            echo "value=$new_version"
            echo "tag=directory_tree-v$new_version"
          } >> "$GITHUB_OUTPUT"

      # A tag that already points at this commit means a re-run after the
      # tag was pushed and a later step failed: keep it and only make sure
      # the release exists. A tag on any other commit is never moved.
      - name: Verify tag is new
        id: tag
        if: steps.version.outputs.changed == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          git fetch --force --tags origin
          if ! git show-ref --verify --quiet "refs/tags/$tag"; then
            echo 'create=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          target=$(git rev-parse "refs/tags/$tag^{commit}")
          if [[ "$target" == "$GITHUB_SHA" ]]; then
            echo "Tag $tag already points at $GITHUB_SHA; it is kept."
            echo 'create=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Tag $tag already exists at $target. Never move or reuse a release tag."
          exit 1

      - name: Create and push tag
        if: steps.version.outputs.changed == 'true' && steps.tag.outputs.create == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"

      - name: Create GitHub release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          args=("$tag" --verify-tag --generate-notes --target "$GITHUB_SHA")
          if [[ "${GITHUB_REF_NAME}" == 'dev' ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"

name: Label release PR

# pull_request_target runs this repository's workflow and labeler config,
# never code from the pull request, so it can label forks safely.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # reads .github/labeler.yml from the base branch.
      pull-requests: write # adds the release label.
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

name: Label release PR

# pull_request_target runs this repository's workflow and labeler config,
# never code from the pull request, so it can label forks safely.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # reads .github/labeler.yml from the base branch.
      pull-requests: write # adds the release label.
    steps:
      - uses: actions/labeler@8558fd74291d67161a8a78ce36a881fa63b766a9 # v5.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

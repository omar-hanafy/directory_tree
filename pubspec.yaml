name: directory_tree
description: >-
  Deterministic, immutable directory trees for pure Dart: canonical paths,
  indexed nodes, flattened rows, filters, selection, and diffs on every platform.
version: 2.0.0
homepage: https://github.com/omar-hanafy/directory_tree
repository: https://github.com/omar-hanafy/directory_tree
issue_tracker: https://github.com/omar-hanafy/directory_tree/issues
documentation: https://pub.dev/documentation/directory_tree/latest/

topics:
  - filesystem
  - tree
  - file-explorer
  - tree-view
  - paths

environment:
  sdk: ^3.8.0

dependencies:
  meta: ^1.16.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.27.0

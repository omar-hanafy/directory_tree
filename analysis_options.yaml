# analysis_options.yaml - public pure-Dart package (published to pub.dev)
# Based on the dart-tools dart-lints dart-package template with its "stricter"
# block enabled. Rule names validated against the live rule list
# (Dart 3.13.5, 2026-10-11). test/ and example/ have their own nested overrides.

include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.mocks.dart"
    - "**/*.gr.dart"
    - "**/*.config.dart"
    - "**/*.gen.dart"
    - "**/*.gql.dart"
    - "lib/generated/**"
    - "lib/**/generated/**"
    - "build/**"
    - ".dart_tool/**"
    # dart fix golden inputs are intentionally written against the old API.
    - "test_fixes/**"
    # Benchmarks are separate packages (one depends on the published 1.x).
    - "benchmark/**"

  # Escalations kept from 1.x: publish-safety rules fail the build.
  errors:
    always_use_package_imports: error
    avoid_relative_lib_imports: error
    depend_on_referenced_packages: error
    implementation_imports: error
    secure_pubspec_urls: error
    public_member_api_docs: error
    library_private_types_in_public_api: warning
    directives_ordering: warning
    deprecated_member_use_from_same_package: warning
    unawaited_futures: warning

linter:
  rules:
    # --- async & resource safety ---
    unawaited_futures: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    # --- correctness ---
    avoid_type_to_string: true
    test_types_in_equals: true
    throw_in_finally: true
    only_throw_errors: true
    unnecessary_statements: true
    no_self_assignments: true
    no_literal_bool_comparisons: true
    # --- import hygiene ---
    always_use_package_imports: true
    directives_ordering: true
    combinators_ordering: true
    # --- style consistency (autofixable) ---
    prefer_single_quotes: true
    unnecessary_parenthesis: true
    avoid_multiple_declarations_per_line: true
    avoid_bool_literals_in_conditional_expressions: true
    matching_super_parameters: true
    use_string_buffers: true
    use_enums: true
    # Kept from 1.x.
    prefer_const_constructors: true
    sort_pub_dependencies: true
    # --- team hygiene ---
    document_ignores: true # every `// ignore:` must say why
    # --- public API quality (pub.dev) ---
    public_member_api_docs: true
    comment_references: true
    avoid_positional_boolean_parameters: true
    avoid_equals_and_hash_code_on_mutable_classes: true
    use_setters_to_change_properties: true
    avoid_returning_this: true
    prefer_asserts_with_message: true
    deprecated_member_use_from_same_package: true
    avoid_print: true # packages must not print; not in the recommended set

    # --- stricter (test/analysis_options.yaml silences these in tests) ---
    prefer_final_locals: true
    prefer_final_in_for_each: true
    avoid_dynamic_calls: true
    discarded_futures: true
    avoid_catches_without_on_clauses: true
    unnecessary_lambdas: true
    cascade_invocations: true

# Line length & trailing commas are owned by the Dart 3.7+ formatter.
